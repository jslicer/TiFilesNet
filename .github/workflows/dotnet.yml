# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage"
    - name: Find coverage files
      run: |
        echo "Coverage files:"
        find . -type f -iname "*cobertura.xml" -print
    - name: Install ReportGenerator
      run: |
        dotnet tool install dotnet-reportgenerator-globaltool \
          --tool-path ./reportgeneratortool \
          --version 5.5.10
    - name: Combine Coverage Reports
      run: |
        ./reportgeneratortool/reportgenerator \
          "-reports:**/*.cobertura.xml" \
          "-targetdir:coveragereport" \
          "-reporttypes:Cobertura" \
          "-title:Code Coverage" \
          "-tag:${{ github.run_number }}_${{ github.run_id }}"
    - name: Upload Combined Coverage XML
      uses: actions/upload-artifact@v7.0.1
      with:
        name: coverage
        path: ${{ github.workspace }}/coveragereport/Cobertura.xml
        retention-days: 5
    - name: Publish Code Coverage Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: "coveragereport/Cobertura.xml"
        badge: true
        fail_below_min: false # just informative for now
        format: markdown
        hide_branch_rate: false
        hide_complexity: false
        indicators: true
        output: both
        thresholds: "10 30"
